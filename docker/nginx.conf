# Standalone mode: Stagemgr serves the root path.
#
# bin/docker-entrypoint installs this file unless a Foundation build is mounted
# at /var/www/foundation-dist, in which case nginx.foundation.conf wins.
# __PASSENGER_APP_ENV__ is substituted at boot from PASSENGER_APP_ENV.

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /var/www/stagemgr/public;
    passenger_enabled on;
    passenger_app_root /var/www/stagemgr;
    passenger_document_root /var/www/stagemgr/public;
    passenger_app_env __PASSENGER_APP_ENV__;
    passenger_sticky_sessions on;
    # Ruby managed by RVM inside the image (see docker/Dockerfile, which asserts
    # this wrapper exists at build time).
    passenger_ruby /usr/local/rvm/wrappers/ruby-3.2.2@stagemgr/ruby;
    passenger_user app;

    # The repo ships public/500.html; there is no 50x.html.
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/stagemgr/public;
        internal;
    }
}
