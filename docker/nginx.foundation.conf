# Foundation mode: a separately built marketing site owns the root path and
# Stagemgr is mounted under /tickets.
#
#   /          → static files from /var/www/foundation-dist
#   /tickets/* → the Rails app (Passenger, passenger_base_uri /tickets)
#
# bin/docker-entrypoint installs this file instead of nginx.conf whenever
# /var/www/foundation-dist is mounted (Theater Wit's workspace does this via
# ../site/infra/compose.stagemgr-tw.yml). server.yml's `sub_uri` must agree.
# __PASSENGER_APP_ENV__ is substituted at boot from PASSENGER_APP_ENV.

server {
    listen 80;
    server_name _;
    # Directory redirects (/foo -> /foo/) must stay relative: nginx listens on
    # 80 inside the container but is published on another host port in dev,
    # and an absolute Location would drop that port.
    absolute_redirect off;

    location / {
        root /var/www/foundation-dist;
        index index.html;
        # No Cache-Control means browsers guess a lifetime from Last-Modified,
        # so a file replaced under the same name (a donor logo, a headshot)
        # stays stale for weeks. no-cache makes them revalidate every use;
        # unchanged files cost only a 304 via nginx's ETag/Last-Modified.
        add_header Cache-Control "no-cache" always;
    }

    # Anchored: without ^ this also matches /anything/tickets.
    location ~ ^/tickets(/.*|$) {
        client_max_body_size 10M;
        alias /var/www/stagemgr/public$1;
        passenger_base_uri /tickets;
        passenger_app_root /var/www/stagemgr;
        passenger_document_root /var/www/stagemgr/public;
        passenger_enabled on;
        passenger_app_env __PASSENGER_APP_ENV__;
        passenger_sticky_sessions on;
        # Ruby managed by RVM inside the image (see docker/Dockerfile, which
        # asserts this wrapper exists at build time).
        passenger_ruby /usr/local/rvm/wrappers/ruby-3.2.2@stagemgr/ruby;
        passenger_user app;
    }

    # The Foundation build has no error pages of its own; use the ones the Rails
    # app ships in public/.
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/stagemgr/public;
        internal;
    }
}
